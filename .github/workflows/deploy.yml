name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Create deployment package
        run: |
          zip application.zip application.py requirements.txt

      - name: Upload package to S3
        run: |
          aws s3 cp application.zip s3://elasticbeanstalk-eu-west-1-445567074266/application-${{ github.sha }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name cmtr-5bf61784-app \
            --version-label ${{ github.sha }} \
            --source-bundle S3Bucket=elasticbeanstalk-eu-west-1-445567074266,S3Key=application-${{ github.sha }}.zip

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name cmtr-5bf61784-env \
            --version-label ${{ github.sha }}
